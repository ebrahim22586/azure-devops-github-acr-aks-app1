# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'f4982ffe-8e2d-4b57-bfe8-2fcaaf341eb5'
  imageRepository: 'acrimageun'
  containerRegistry: 'acrforaksun.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  secretName: 'imgpullsecaks'
  

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
    - bash: echo "SystemDirectory Content"; ls -R $(System.DefaultWorkingDirectory)      
    - bash: echo "ArtifactsDirectory Content Before"; ls -R $(Build.ArtifactStagingDirectory)      
    - task: CopyFiles@2
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)/aksfiles'
        Contents: '**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'
        OverWrite: true

    
    - bash: echo "ArtifactsDirectory Content after"; ls -R $(Build.ArtifactStagingDirectory)
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'aksfiles'
        publishLocation: 'Container'

- stage: Deploy
  displayName: Deploy To AKS DEV Stage
  dependsOn: Build
  jobs:
  - job: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    steps:
      - task: DownloadBuildArtifacts@1
        inputs:
          buildType: 'current'
          downloadType: 'single'
          artifactName: 'aksfiles'
          downloadPath: '$(Build.ArtifactStagingDirectory)'

      - task: KubernetesManifest@1
        inputs:
           action: 'createSecret'
           connectionType: 'kubernetesServiceConnection'
           kubernetesServiceConnection: 'dev-ns-k8s-aks-svc-conn'
           namespace: 'dev'
           secretType: 'dockerRegistry'
           secretName: '$(secretName)'
           dockerRegistryEndpoint: '$(dockerRegistryServiceConnection)'


      - task: KubernetesManifest@1
        inputs:
           action: 'deploy'
           connectionType: 'kubernetesServiceConnection'
           kubernetesServiceConnection: 'dev-ns-k8s-aks-svc-conn'
           namespace: 'dev'
           manifests: '$(Build.ArtifactStagingDirectory)/aksfiles/appwithservice.yml'
           containers: '$(containerRegistry)/$(imageRepository):$(tag)'
           imagePullSecrets: '$(secretName)'
          


           



