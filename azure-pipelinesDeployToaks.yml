# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker



resources:
  pipelines:
  - pipeline: 'CI'
    source: 'CIPipeline'
    trigger:
      branches:
        include:
        - main

variables:
  dockerRegistryServiceConnection: 'f4982ffe-8e2d-4b57-bfe8-2fcaaf341eb5'
  imageRepository: 'acrimageun'
  containerRegistry: 'acrforaksun.azurecr.io'
  secretName: 'imgpullsecaks'
  vmImageName: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

steps:

- download: CI
  artifact: aksfiles

- bash: |
    IMAGE_TAG=$(cat $(Pipeline.Workspace)/CI/aksfiles/imageTag.txt | tr -d '[:space:]')
    echo "Trimmed Image Tag = [$IMAGE_TAG]"
    echo "##vso[task.setvariable variable=imageTag]$IMAGE_TAG"
  displayName: Read and Trim Image Tag

- task: KubernetesManifest@1
  inputs:
    action: 'createSecret'
    connectionType: 'kubernetesServiceConnection'
    kubernetesServiceConnection: 'dev-ns-k8s-aks-svc-conn'
    namespace: 'dev'
    secretType: 'dockerRegistry'
    secretName: '$(secretName)'
    dockerRegistryEndpoint: '$(dockerRegistryServiceConnection)'

- task: KubernetesManifest@1
  inputs:
    action: 'deploy'
    connectionType: 'kubernetesServiceConnection'
    kubernetesServiceConnection: 'dev-ns-k8s-aks-svc-conn'
    namespace: 'dev'
    manifests: '$(Pipeline.Workspace)/CI/aksfiles/appwithservice.yml'
    containers: '$(containerRegistry)/$(imageRepository):$(imageTag)'
    imagePullSecrets: '$(secretName)'
